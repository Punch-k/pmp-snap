<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PMP Snap">
<title>PMP Snap</title>
<style>
  /* Layout: full-bleed live camera. Glass status pill and gear on top, a glass answer panel above one big glass Answer button. */
  :root {
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.72);
    --accent: #0a84ff;
    --ok: #30d158;
    --warn: #ffd60a;
    --bad: #ff453a;
    --hairline: rgba(255, 255, 255, 0.28);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", Arial, sans-serif;
    --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --safe-b: max(16px, env(safe-area-inset-bottom));
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    position: fixed; inset: 0; overflow: hidden;
    font-family: var(--font); color: var(--text);
    -webkit-user-select: none; user-select: none; touch-action: manipulation; overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; }

  /* Glass material */
  .glass {
    position: relative;
    background: linear-gradient(160deg, rgba(255,255,255,0.20), rgba(255,255,255,0.05) 55%), rgba(20, 24, 30, 0.30);
    -webkit-backdrop-filter: blur(26px) saturate(190%);
    backdrop-filter: blur(26px) saturate(190%);
    border: 1px solid var(--hairline);
    box-shadow: 0 12px 32px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -1px 0 rgba(255,255,255,0.08);
  }

  video#cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #05080b; }
  .shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.45), transparent 20%, transparent 58%, rgba(0,0,0,0.58)); }
  .frame { position: absolute; inset: 14% 8% 34% 8%; pointer-events: none; }
  .frame i { position: absolute; width: 30px; height: 30px; border: 0 solid rgba(255,255,255,0.7); }
  .frame i:nth-child(1) { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 10px; }
  .frame i:nth-child(2) { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 10px; }
  .frame i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 10px; }
  .frame i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 10px; }

  /* Top bar */
  .top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 20px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 10px currentColor; color: var(--warn); }
  .dot.ok { background: var(--ok); color: var(--ok); }
  .dot.bad { background: var(--bad); color: var(--bad); }
  .round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .round svg { width: 22px; height: 22px; }

  /* Answer panel */
  .panel {
    position: absolute; z-index: 5; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 48px);
    bottom: calc(var(--safe-b) + 76px + 18px);
    min-width: 148px; padding: 14px 32px 12px; border-radius: 36px; text-align: center; cursor: pointer;
    opacity: 0; transform: translateY(14px) scale(0.96); pointer-events: none;
    transition: opacity 0.22s ease, transform 0.32s cubic-bezier(0.2, 0.9, 0.25, 1.1);
  }
  .panel.show { opacity: 1; transform: none; pointer-events: auto; }
  .letter { font-family: var(--round); font-weight: 700; font-size: 108px; line-height: 1.02; letter-spacing: -0.02em; text-shadow: 0 2px 18px rgba(0,0,0,0.35); font-variant-numeric: tabular-nums; }
  .letter.multi { font-size: 64px; line-height: 1.2; }
  .letter[hidden], .msg[hidden], .loader[hidden], .meta[hidden] { display: none; }
  .meta { margin-top: 2px; font-size: 13px; color: var(--text-dim); font-weight: 500; }
  .msg { font-size: 17px; line-height: 1.35; font-weight: 600; padding: 6px 4px 8px; max-width: 300px; text-wrap: balance; }
  .msg.bad { color: #ffb4ae; }
  .loader { display: flex; gap: 9px; justify-content: center; align-items: center; height: 80px; }
  .loader span { width: 13px; height: 13px; border-radius: 50%; background: #fff; opacity: 0.35; animation: pulse 1.1s ease-in-out infinite; }
  .loader span:nth-child(2) { animation-delay: 0.16s; }
  .loader span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.1); } }

  /* Answer button */
  .answer {
    position: absolute; z-index: 5; left: 0; right: 0; margin: 0 auto; bottom: var(--safe-b);
    width: min(calc(100% - 48px), 380px); height: 76px; border-radius: 38px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: 24px; font-weight: 650; letter-spacing: -0.015em; text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    background: linear-gradient(165deg, rgba(255,255,255,0.38), rgba(255,255,255,0.06) 60%), rgba(10, 132, 255, 0.62);
    border-color: rgba(255,255,255,0.4);
    transition: transform 0.12s ease;
  }
  .answer:active { transform: scale(0.97); }
  .answer svg { width: 26px; height: 26px; }
  .answer.busy svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .flash { position: absolute; inset: 0; z-index: 4; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash 0.22s ease-out; }
  @keyframes flash { 0% { opacity: 0.55; } 100% { opacity: 0; } }

  /* Gate (camera problems) */
  .gate { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; padding: 24px; background: rgba(0,0,0,0.55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .gate[hidden] { display: none; }
  .card { width: min(100%, 360px); border-radius: 30px; padding: 26px 22px 22px; text-align: center; }
  .card h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.02em; }
  .card p { margin: 0 0 18px; font-size: 16px; line-height: 1.45; color: var(--text-dim); }

  .btn { appearance: none; border: 0; cursor: pointer; height: 50px; padding: 0 22px; border-radius: 25px; font-size: 17px; font-weight: 600; background: var(--accent); color: #fff; width: 100%; }
  .btn.ghost { background: rgba(255,255,255,0.14); margin-top: 10px; }
  .btn:active { filter: brightness(0.9); }

  /* Settings sheet */
  .scrim { position: absolute; inset: 0; z-index: 9; background: rgba(0,0,0,0.45); opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s; }
  .sheet {
    position: absolute; z-index: 10; left: 0; right: 0; bottom: 0; max-height: 90%; overflow: auto;
    border-radius: 30px 30px 0 0; padding: 10px 20px calc(var(--safe-b) + 6px);
    background: linear-gradient(170deg, rgba(255,255,255,0.16), rgba(255,255,255,0.03) 50%), rgba(28, 30, 36, 0.78);
    -webkit-backdrop-filter: blur(34px) saturate(180%); backdrop-filter: blur(34px) saturate(180%);
    border: 1px solid var(--hairline); border-bottom: 0;
    transform: translateY(105%); visibility: hidden; transition: transform 0.38s cubic-bezier(0.2, 0.85, 0.25, 1), visibility 0.38s;
    -webkit-user-select: text; user-select: text;
  }
  body.sheet-open .scrim { opacity: 1; visibility: visible; }
  body.sheet-open .sheet { transform: none; visibility: visible; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.4); margin: 0 auto 14px; }
  .sheet h2 { margin: 0 0 14px; font-size: 24px; letter-spacing: -0.02em; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.02em; text-transform: uppercase; }
  .field input[type="text"], .field input[type="password"] {
    height: 50px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1);
    color: #fff; padding: 0 14px; font-size: 16px; font-family: var(--font); outline: none; width: 100%;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,0.35); }
  .field small { font-size: 13px; line-height: 1.4; color: var(--text-dim); }
  .field a { color: #7cc0ff; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); }
  .seg button { appearance: none; border: 0; background: transparent; height: 40px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--text-dim); }
  .seg button[aria-pressed="true"] { background: rgba(255,255,255,0.92); color: #0b1218; }
  .status { min-height: 20px; margin: -4px 0 12px; font-size: 14px; font-weight: 600; }
  .status.ok { color: var(--ok); }
  .status.bad { color: #ffb4ae; }

  button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .panel, .sheet, .scrim, .answer { transition: none; }
    .loader span, .answer.busy svg { animation: none; }
    .flash.go { animation: none; }
  }
  @media (max-height: 560px) { .letter { font-size: 72px; } .frame { inset: 10% 6% 40% 6%; } }
</style>
</head>
<body>
  <video id="cam" autoplay muted playsinline></video>
  <div class="shade"></div>
  <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div id="flash" class="flash"></div>

  <header class="top">
    <div class="pill glass"><span id="dot" class="dot"></span><span id="status">Starting camera</span></div>
    <button id="gear" class="round glass" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section id="panel" class="panel glass" aria-live="assertive" title="Tap to dismiss">
    <div id="loader" class="loader" hidden><span></span><span></span><span></span></div>
    <div id="letter" class="letter" hidden></div>
    <div id="msg" class="msg" hidden></div>
    <div id="meta" class="meta" hidden></div>
  </section>

  <button id="answer" class="answer glass" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none"/></svg>
    <span id="answerLabel">Answer</span>
  </button>

  <div id="gate" class="gate" hidden>
    <div class="card glass">
      <h2 id="gateTitle"></h2>
      <p id="gateText"></p>
      <button id="gateBtn" class="btn" type="button">Turn on camera</button>
    </div>
  </div>

  <div id="scrim" class="scrim"></div>
  <aside id="sheet" class="sheet" aria-label="Settings" aria-hidden="true">
    <div class="grab"></div>
    <h2>Settings</h2>
    <div class="field">
      <label for="key">Gemini API key</label>
      <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your key">
      <small>Free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. It stays on this phone and goes only to Google.</small>
    </div>
    <div class="field">
      <label for="model">Model</label>
      <input id="model" type="text" list="models" autocomplete="off" autocapitalize="off" spellcheck="false">
      <datalist id="models"></datalist>
    </div>
    <div class="field">
      <label for="exam">Exam</label>
      <input id="exam" type="text" autocomplete="off" spellcheck="false" placeholder="PMP">
    </div>
    <div class="field">
      <label id="speedLabel">Speed</label>
      <div class="seg" role="group" aria-labelledby="speedLabel">
        <button type="button" data-level="low" aria-pressed="false">Fast</button>
        <button type="button" data-level="medium" aria-pressed="true">Balanced</button>
        <button type="button" data-level="high" aria-pressed="false">Best</button>
      </div>
    </div>
    <div id="saveStatus" class="status" role="status"></div>
    <button id="save" class="btn" type="button">Save and test</button>
    <button id="close" class="btn ghost" type="button">Done</button>
  </aside>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* Home-screen icon, drawn at load */
  try {
    var ic = document.createElement('canvas'); ic.width = ic.height = 180;
    var g = ic.getContext('2d'), gr = g.createLinearGradient(0, 0, 180, 180);
    gr.addColorStop(0, '#0c1420'); gr.addColorStop(1, '#0a84ff');
    g.fillStyle = gr; g.fillRect(0, 0, 180, 180);
    g.strokeStyle = '#fff'; g.lineWidth = 9; g.beginPath(); g.arc(90, 90, 52, 0, 7); g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(90, 90, 22, 0, 7); g.fill();
    var iconUrl = ic.toDataURL('image/png');
    ['apple-touch-icon', 'icon'].forEach(function (rel) { var l = document.createElement('link'); l.rel = rel; l.href = iconUrl; document.head.appendChild(l); });
  } catch (e) {}

  var cam = $('cam'), dot = $('dot'), statusEl = $('status');
  var panel = $('panel'), loader = $('loader'), letterEl = $('letter'), msgEl = $('msg'), metaEl = $('meta');
  var answerBtn = $('answer'), answerLabel = $('answerLabel');
  var gate = $('gate'), gateTitle = $('gateTitle'), gateText = $('gateText'), gateBtn = $('gateBtn');
  var sheet = $('sheet'), keyEl = $('key'), modelEl = $('model'), examEl = $('exam'), saveStatus = $('saveStatus');

  var STORE = 'pmpsnap.v1';
  var API = 'https://generativelanguage.googleapis.com/v1beta/';
  var cfg = { key: '', model: 'gemini-3.8-flash', exam: 'PMP', level: 'medium' };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
  function persist() { try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) {} }

  /* ---------- Camera: starts on load, stays on, restarts after the app was in the background ---------- */
  var stream = null, wake = null;

  function setStatus(text, kind) {
    statusEl.textContent = text;
    dot.className = 'dot' + (kind ? ' ' + kind : '');
  }
  function showGate(title, text, withButton) {
    gateTitle.textContent = title; gateText.textContent = text;
    gateBtn.hidden = !withButton; gate.hidden = false;
    setStatus('Camera off', 'bad');
  }
  function liveTrack() {
    var t = stream && stream.getVideoTracks()[0];
    return t && t.readyState === 'live' ? t : null;
  }
  async function startCamera() {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showGate('Open this over https', 'Browsers only allow the camera on secure pages. Host this file on an https link, open that link, then add it to your home screen.', false);
      return;
    }
    setStatus('Starting camera', '');
    try {
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); }
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      cam.srcObject = stream;
      try { await cam.play(); } catch (e) {}
      var track = stream.getVideoTracks()[0];
      track.addEventListener('ended', function () { setStatus('Camera off', 'bad'); });
      gate.hidden = true;
      setStatus('Camera on', 'ok');
      requestWake();
    } catch (e) {
      if (e && (e.name === 'NotFoundError' || e.name === 'OverconstrainedError')) {
        showGate('No camera found', 'This device has no usable camera.', true);
      } else {
        showGate('Camera is blocked', 'Allow camera access for this page in your browser settings, then tap the button.', true);
      }
    }
  }
  async function requestWake() {
    try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', function () { wake = null; }); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      if (!liveTrack()) { startCamera(); } else { requestWake(); }
    }
  });
  gateBtn.addEventListener('click', startCamera);

  /* ---------- Capture and ask Gemini ---------- */
  var ctl = null;
  var flashEl = $('flash');

  function capture() {
    var w = cam.videoWidth, h = cam.videoHeight;
    var s = Math.min(1, 1600 / Math.max(w, h));
    var c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(cam, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85).split(',')[1];
  }

  function systemText() {
    var pmp = /pmp|pmi|capm|pmbok/i.test(cfg.exam || '');
    return 'You answer multiple-choice exam questions shown in a photo of a screen. ' +
      'Pick the one question that is most complete and most central in the photo. ' +
      'Reply with ONLY the letter of the correct option, for example: B. ' +
      'If the question needs more than one answer, reply with the letters separated by commas, for example: A, C. ' +
      'Never explain and never add other words. If you truly cannot read a question, reply with ?.' +
      (pmp
        ? ' These are PMP exam questions. Answer by PMI standards (PMBOK Guide 7th edition, Agile Practice Guide, current exam content outline): favor the proactive, collaborative, stakeholder-engaging, process-compliant response, and for situational questions choose the best next step, not merely a true statement.'
        : ' The exam is: ' + (cfg.exam || 'general') + '.');
  }

  function parseLetters(text) {
    var t = String(text || '').toUpperCase().trim();
    if (!t) return '?';
    var re = /(?:^|[^A-Z])([A-H])(?![A-Z])/g, out = [], m;
    while ((m = re.exec(t)) !== null) { if (out.indexOf(m[1]) < 0) out.push(m[1]); if (t.length > 40) break; }
    return out.length ? out.join(', ') : '?';
  }

  async function ask(b64, signal, level) {
    var body = {
      systemInstruction: { parts: [{ text: systemText() }] },
      contents: [{ role: 'user', parts: [{ text: 'Answer this question.' }, { inlineData: { mimeType: 'image/jpeg', data: b64 } }] }],
      generationConfig: {}
    };
    if (level) body.generationConfig.thinkingConfig = { thinkingLevel: level };
    var r = await fetch(API + 'models/' + encodeURIComponent(cfg.model) + ':generateContent', {
      method: 'POST', signal: signal,
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cfg.key },
      body: JSON.stringify(body)
    });
    var j = {};
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) {
      var err = new Error((j.error && j.error.message) || ('HTTP ' + r.status));
      err.status = r.status; throw err;
    }
    if (j.promptFeedback && j.promptFeedback.blockReason) {
      var be = new Error('Blocked: ' + j.promptFeedback.blockReason); be.status = 0; throw be;
    }
    var cand = (j.candidates || [])[0] || {};
    var parts = (cand.content && cand.content.parts) || [];
    return parts.filter(function (p) { return p.text && !p.thought; }).map(function (p) { return p.text; }).join('').trim();
  }

  function humanError(e) {
    var s = e && e.status, m = (e && e.message) || '';
    if (s === 400 && /api key/i.test(m)) return 'API key not valid. Check it in Settings.';
    if (s === 401 || s === 403) return 'Google rejected the key. Check it in Settings.';
    if (s === 404) return 'Model not found. Pick another in Settings.';
    if (s === 429) return 'Rate limit reached. Wait a few seconds, then tap Answer.';
    if (s >= 500) return 'Gemini is busy. Tap Answer again.';
    if (e instanceof TypeError) return 'No connection. Check your signal and tap Answer again.';
    return m.slice(0, 120) || 'Something went wrong. Tap Answer again.';
  }

  function showPanel(kind, a, b) {
    loader.hidden = kind !== 'busy';
    letterEl.hidden = kind !== 'result';
    msgEl.hidden = kind !== 'error';
    metaEl.hidden = kind !== 'result';
    if (kind === 'result') {
      letterEl.textContent = a;
      letterEl.className = 'letter' + (a.length > 2 ? ' multi' : '');
      metaEl.textContent = b;
    } else if (kind === 'error') {
      msgEl.textContent = a; msgEl.className = 'msg bad';
    }
    panel.classList.add('show');
  }
  function hidePanel() { panel.classList.remove('show'); }
  function setBusy(on) {
    answerBtn.classList.toggle('busy', on);
    answerLabel.textContent = on ? 'Reading' : 'Answer';
  }

  async function onAnswer() {
    if (!cfg.key) { openSheet('Add your Gemini API key to start.', 'bad'); return; }
    if (!liveTrack() || !cam.videoWidth) { showPanel('error', 'Camera is not ready yet.'); startCamera(); return; }
    if (ctl) ctl.abort();
    var mine = ctl = new AbortController();
    var timedOut = false;
    var timer = setTimeout(function () { timedOut = true; mine.abort(); }, 30000);
    flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go');
    var img = capture(), t0 = performance.now();
    showPanel('busy'); setBusy(true);
    try {
      var text;
      try { text = await ask(img, mine.signal, cfg.level); }
      catch (e) {
        if (e.status === 400 && /thinking/i.test(e.message || '')) { text = await ask(img, mine.signal, null); }
        else { throw e; }
      }
      if (mine !== ctl) return;
      var secs = ((performance.now() - t0) / 1000).toFixed(1);
      showPanel('result', parseLetters(text), cfg.model + ' · ' + secs + ' s');
      try { if (navigator.vibrate) navigator.vibrate(30); } catch (e2) {}
    } catch (e) {
      if (mine !== ctl) return;
      if (e && e.name === 'AbortError') { if (timedOut) showPanel('error', 'Took too long. Tap Answer again.'); return; }
      showPanel('error', humanError(e));
    } finally {
      clearTimeout(timer);
      if (mine === ctl) setBusy(false);
    }
  }
  answerBtn.addEventListener('click', onAnswer);
  panel.addEventListener('click', hidePanel);

  /* ---------- Settings ---------- */
  function openSheet(note, kind) {
    keyEl.value = cfg.key; modelEl.value = cfg.model; examEl.value = cfg.exam;
    setLevelButtons(cfg.level);
    saveStatus.textContent = note || ''; saveStatus.className = 'status' + (kind ? ' ' + kind : '');
    document.body.classList.add('sheet-open'); sheet.setAttribute('aria-hidden', 'false');
  }
  function closeSheet() { document.body.classList.remove('sheet-open'); sheet.setAttribute('aria-hidden', 'true'); }
  function setLevelButtons(level) {
    Array.prototype.forEach.call(sheet.querySelectorAll('.seg button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-level') === level ? 'true' : 'false');
    });
  }
  Array.prototype.forEach.call(sheet.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () { setLevelButtons(b.getAttribute('data-level')); });
  });
  $('gear').addEventListener('click', function () { openSheet(''); });
  $('scrim').addEventListener('click', closeSheet);
  $('close').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  async function listModels(key) {
    var r = await fetch(API + 'models?pageSize=200', { headers: { 'x-goog-api-key': key } });
    var j = {};
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) { var err = new Error((j.error && j.error.message) || ('HTTP ' + r.status)); err.status = r.status; throw err; }
    return (j.models || [])
      .filter(function (m) { return (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0; })
      .map(function (m) { return m.name.replace(/^models\//, ''); })
      .filter(function (n) { return /^gemini/.test(n) && !/(image|tts|live|audio|embedding|robotics|computer|native)/.test(n); });
  }
  function versionOf(n) { var m = n.match(/^gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; }

  $('save').addEventListener('click', async function () {
    var level = 'medium';
    Array.prototype.forEach.call(sheet.querySelectorAll('.seg button'), function (b) { if (b.getAttribute('aria-pressed') === 'true') level = b.getAttribute('data-level'); });
    cfg.key = keyEl.value.trim(); cfg.model = modelEl.value.trim() || 'gemini-3.8-flash';
    cfg.exam = examEl.value.trim() || 'PMP'; cfg.level = level;
    persist();
    if (!cfg.key) { saveStatus.textContent = 'Saved. Add a key to get answers.'; saveStatus.className = 'status bad'; return; }
    saveStatus.textContent = 'Checking key...'; saveStatus.className = 'status';
    try {
      var names = await listModels(cfg.key);
      var dl = $('models'); dl.textContent = '';
      names.forEach(function (n) { var o = document.createElement('option'); o.value = n; dl.appendChild(o); });
      var note = 'Key works.';
      if (names.length && names.indexOf(cfg.model) < 0) {
        var flash = names.filter(function (n) { return /^gemini-\d+(\.\d+)?-flash$/.test(n); })
          .sort(function (a, b) { return versionOf(b) - versionOf(a); })[0] || names[0];
        cfg.model = flash; modelEl.value = flash; persist();
        note = 'Key works. Model set to ' + flash + '.';
      }
      saveStatus.textContent = note; saveStatus.className = 'status ok';
    } catch (e) {
      saveStatus.textContent = humanError(e); saveStatus.className = 'status bad';
    }
  });

  /* ---------- Go ---------- */
  startCamera();
  if (!cfg.key) { setTimeout(function () { if (gate.hidden) openSheet('Add your Gemini API key to start.', 'bad'); }, 600); }
})();
</script>
</body>
</html>
