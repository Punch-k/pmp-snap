<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PMP Snap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>PMP Snap</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      --round: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
      --accent: #0a84ff;
      --bad: #ff6b60;
      --st: env(safe-area-inset-top, 0px);
      --sb: env(safe-area-inset-bottom, 0px);
      --sl: env(safe-area-inset-left, 0px);
      --sr: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: var(--font); color: #fff; }
    .hidden { display: none !important; }

    #cameraFeed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      background: #000;
    }

    .top-btn {
      position: fixed;
      top: calc(var(--st) + 16px);
      left: calc(var(--sl) + 16px);
      z-index: 10;
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(28, 28, 30, 0.48);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .top-btn svg { width: 18px; height: 18px; }

    /* Bottom-center Apple frosted glass pill */
    .glass-answer {
      position: fixed;
      bottom: calc(var(--sb) + 26px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      max-width: calc(100vw - var(--sl) - var(--sr) - 195px);
      min-width: 175px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(28, 28, 30, 0.56);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.2, 0.85, 0.25, 1);
    }

    .glass-answer.hidden-pill {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
    }

    .qnum-tag { font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, 0.75); flex-shrink: 0; }
    .ans-badge {
      font-family: var(--round);
      font-weight: 800;
      font-size: 15px;
      line-height: 1;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(10, 132, 255, 0.9);
      color: #fff;
      flex-shrink: 0;
    }
    .ans-badge.err-badge { background: rgba(255, 107, 96, 0.9); }
    .ans-line {
      font-size: 14.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.96);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dots { display: flex; gap: 5px; padding: 4px 2px; }
    .dots span {
      width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: 0.35;
      animation: pulse 1s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.1); } }

    /* Bottom-right shutter button (Portrait & Landscape) */
    .shutter-wrap {
      position: fixed;
      right: calc(var(--sr) + 22px);
      bottom: calc(var(--sb) + 20px);
      z-index: 10;
    }

    @media (orientation: landscape) {
      .shutter-wrap { right: calc(var(--sr) + 24px); bottom: calc(var(--sb) + 18px); }
      .glass-answer { bottom: calc(var(--sb) + 22px); max-width: calc(100vw - var(--sl) - var(--sr) - 220px); }
    }

    .fab {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 3px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      transition: transform 0.12s ease;
    }
    .fab::after {
      content: "";
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .fab:active { transform: scale(0.92); }
    .fab.busy::after { background: var(--accent); animation: spinPulse 0.9s ease-in-out infinite; }
    @keyframes spinPulse { 0%, 100% { transform: scale(0.85); } 50% { transform: scale(1); } }

    /* History Sheet */
    .scrim {
      position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, 0.55);
      opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s;
    }
    .sheet {
      position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
      max-height: 85vh; overflow-y: auto; max-width: 600px; margin: 0 auto;
      border-radius: 26px 26px 0 0;
      padding: 12px calc(var(--sr) + 20px) calc(var(--sb) + 20px) calc(var(--sl) + 20px);
      background: rgba(22, 24, 30, 0.92);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-bottom: 0;
      transform: translateY(105%); visibility: hidden;
      transition: transform 0.32s cubic-bezier(0.2, 0.85, 0.25, 1), visibility 0.32s;
    }
    body.sheet-open .scrim { opacity: 1; visibility: visible; }
    .sheet.open { transform: none; visibility: visible; }
    .grab { width: 38px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); margin: 0 auto 14px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet h2 { font-size: 20px; font-weight: 700; }

    .hist { display: flex; flex-direction: column; gap: 10px; }
    .hitem {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .hitem .row { display: flex; align-items: center; gap: 12px; }
    .hitem .qbadge {
      font-family: var(--round); font-weight: 700; font-size: 13px; padding: 4px 8px;
      border-radius: 8px; background: rgba(255, 255, 255, 0.12); color: rgba(255, 255, 255, 0.85); flex-shrink: 0;
    }
    .hitem .hl {
      font-family: var(--round); font-weight: 800; font-size: 17px; min-width: 34px; height: 34px;
      padding: 0 8px; border-radius: 10px; display: grid; place-items: center;
      background: rgba(10, 132, 255, 0.35); color: #fff; flex-shrink: 0;
    }
    .hitem .ht { flex: 1; min-width: 0; }
    .hitem .hq { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hitem .hs { font-size: 12px; color: rgba(255, 255, 255, 0.6); margin-top: 2px; }
    .hitem .hr { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 13.5px; line-height: 1.45; color: rgba(255,255,255,0.85); }
    .hitem.open .hr { display: block; }
    .hitem.open .hq { white-space: normal; }

    .btn {
      appearance: none; border: 0; cursor: pointer; height: 46px; padding: 0 20px;
      border-radius: 999px; font-size: 16px; font-weight: 600; background: rgba(255, 255, 255, 0.12); color: #fff; width: 100%; margin-top: 10px;
    }
    .btn.danger { background: transparent; color: var(--bad); margin-top: 8px; font-size: 14px; height: 40px; }
  </style>
</head>
<body>

  <video id="cameraFeed" autoplay playsinline muted></video>
  <canvas id="captureCanvas" class="hidden"></canvas>

  <button id="histBtn" class="top-btn" type="button" aria-label="Previous questions">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
      <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
    </svg>
    <span id="histCount">Questions (0)</span>
  </button>

  <div id="answerPill" class="glass-answer hidden-pill" role="button" tabindex="0" aria-live="polite"></div>

  <div class="shutter-wrap">
    <button id="snapBtn" class="fab" type="button" aria-label="Snap and get answer"></button>
  </div>

  <input id="fallbackInput" type="file" accept="image/*" capture="environment" class="hidden">
  <div id="scrim" class="scrim"></div>

  <aside id="historySheet" class="sheet" aria-label="Previous questions" aria-hidden="true">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2>Previous Questions</h2>
      <span style="font-size:12px;color:rgba(255,255,255,0.6);">Sorted by #</span>
    </div>
    <div id="hist" class="hist"></div>
    <button class="btn" data-close type="button">Close</button>
    <button id="clearHist" class="btn danger" type="button">Clear all questions</button>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      var HIST_KEY = 'pmpsnap.silent.history';
      var history = [];
      try { history = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch (e) {}

      var pendingSnap = null;
      var timeoutTimer = null;
      var pill = $('answerPill');
      var snapBtn = $('snapBtn');

      function extractQuestionNum(text) {
        var m = String(text || '').match(/(?:^|\b(?:question|q|#)\s*\.?\s*)(\d{1,4})\b/i);
        return m ? parseInt(m[1], 10) : Number.MAX_SAFE_INTEGER;
      }

      function sortHistoryByNumber() {
        history.sort(function (a, b) {
          var na = typeof a.qnum === 'number' ? a.qnum : extractQuestionNum(a.question);
          var nb = typeof b.qnum === 'number' ? b.qnum : extractQuestionNum(b.question);
          if (na !== nb) return na - nb;
          return (a.t || 0) - (b.t || 0);
        });
      }

      function saveHistory() {
        sortHistoryByNumber();
        try { localStorage.setItem(HIST_KEY, JSON.stringify(history.slice(0, 150))); } catch (e) {}
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function showPillLoading(msg) {
        pill.innerHTML = '<div class="dots"><span></span><span></span><span></span></div><span class="ans-line">' + esc(msg) + '</span>';
        pill.classList.remove('hidden-pill');
      }

      function showPillAnswer(qnum, answer, reason) {
        var cleanReason = String(reason || '').replace(/\s+/g, ' ').trim();
        var qLabel = (qnum !== Number.MAX_SAFE_INTEGER) ? '<span class="qnum-tag">Q' + esc(qnum) + '</span>' : '';
        pill.innerHTML = qLabel + '<span class="ans-badge">' + esc(answer) + '</span><span class="ans-line">' + esc(cleanReason) + '</span>';
        pill.classList.remove('hidden-pill');
      }

      function showPillError(msg) {
        pill.innerHTML = '<span class="ans-badge err-badge">!</span><span class="ans-line">' + esc(msg) + '</span>';
        pill.classList.remove('hidden-pill');
      }

      /* ---------- Receive Answer Back From Background Gemini Tab ---------- */
      window.addEventListener('pmp-snap-answer', function (e) {
        clearTimeout(timeoutTimer);
        snapBtn.classList.remove('busy');
        var res = e.detail || {};

        if (res.error) {
          showPillError(res.error);
          return;
        }

        var rawResponse = String(res.text || '').trim();
        var letterMatch = rawResponse.match(/\b([A-D])\b\s*[-—:\)\.]\s*(.+)/i);
        var answerLetter = letterMatch ? letterMatch[1].toUpperCase() : (rawResponse.match(/^\s*([A-D])\b/i) || ['', '?'])[1].toUpperCase();
        var briefReason = letterMatch ? letterMatch[2].split('\n')[0] : rawResponse.split('\n')[0];

        var qnum = (pendingSnap && typeof pendingSnap.qnum === 'number') ? pendingSnap.qnum : extractQuestionNum(rawResponse);
        var qSummary = (pendingSnap && pendingSnap.question) ? pendingSnap.question : 'PMP Practice Question';
        pendingSnap = null;

        showPillAnswer(qnum, answerLetter, briefReason);

        var entry = {
          t: Date.now(),
          qnum: qnum,
          question: qSummary,
          answer: answerLetter,
          reason: briefReason,
          fullResponse: rawResponse
        };

        if (qnum !== Number.MAX_SAFE_INTEGER) {
          var idx = history.findIndex(function (h) { return h.qnum === qnum; });
          if (idx >= 0) history[idx] = entry;
          else history.push(entry);
        } else {
          history.push(entry);
        }

        saveHistory();
        renderHistory();
        if (navigator.vibrate) try { navigator.vibrate(25); } catch (err) {}
      });

      /* ---------- Local OCR & Live Camera ---------- */
      var ocrWorker = null;
      var ocrInitPromise = null;

      function getOcrWorker() {
        if (!window.Tesseract) return Promise.resolve(null);
        if (ocrWorker) return Promise.resolve(ocrWorker);
        if (!ocrInitPromise) {
          ocrInitPromise = Tesseract.createWorker('eng')
            .then(function (w) { ocrWorker = w; return w; })
            .catch(function () { ocrInitPromise = null; return null; });
        }
        return ocrInitPromise;
      }

      var video = $('cameraFeed');
      var canvas = $('captureCanvas');
      var cameraReady = false;

      async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
        try {
          var stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
          video.srcObject = stream;
          video.onloadedmetadata = function () {
            video.play();
            cameraReady = true;
            setTimeout(getOcrWorker, 500);
          };
        } catch (err) {
          showPillError('Camera blocked — tap shutter to pick photo');
        }
      }

      function drawVideoToCanvas() {
        var w = video.videoWidth;
        var h = video.videoHeight;
        if (!w || !h) return false;
        var scale = Math.min(1, 1400 / Math.max(w, h));
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        return true;
      }

      async function processSnap() {
        snapBtn.classList.add('busy');
        showPillLoading('Reading question…');

        try {
          var worker = await getOcrWorker();
          var rawText = '';
          if (worker) {
            var ret = await worker.recognize(canvas);
            rawText = (ret && ret.data && ret.data.text) ? ret.data.text.replace(/\n{3,}/g, '\n\n').trim() : '';
          }

          if (!rawText || rawText.length < 25) {
            showPillError('Text unclear — move closer & retry');
            snapBtn.classList.remove('busy');
            return;
          }

          var qnum = extractQuestionNum(rawText);
          pendingSnap = {
            qnum: qnum,
            question: rawText.replace(/\s+/g, ' ').slice(0, 120)
          };

          var prompt = [
            'Answer this PMP question by PMI standards (PMBOK 7th Edition & Agile Practice Guide).',
            'Reply on the FIRST LINE in this exact format: [Option Letter] - [Strict 1-line brief reason, max 12 words].',
            '',
            rawText
          ].join('\n');

          showPillLoading('Getting answer…');
          clearTimeout(timeoutTimer);
          timeoutTimer = setTimeout(function () {
            snapBtn.classList.remove('busy');
            showPillError('No response — keep Gemini PMP tab open in Edge');
          }, 35000);

          window.dispatchEvent(new CustomEvent('pmp-snap-request', { detail: { prompt: prompt } }));
        } catch (e) {
          showPillError('Failed to capture question');
          snapBtn.classList.remove('busy');
        }
      }

      function renderHistory() {
        sortHistoryByNumber();
        var box = $('hist');
        box.innerHTML = '';
        $('histCount').textContent = 'Questions (' + history.length + ')';

        if (!history.length) {
          box.innerHTML = '<div style="color:rgba(255,255,255,0.6);font-size:14px;padding:8px 2px;">Snapped questions appear here sorted by question number.</div>';
          return;
        }

        history.forEach(function (h) {
          var numLabel = h.qnum !== Number.MAX_SAFE_INTEGER ? 'Q' + h.qnum : 'Q—';
          var el = document.createElement('div');
          el.className = 'hitem';
          el.innerHTML =
            '<div class="row">' +
              '<div class="qbadge">' + esc(numLabel) + '</div>' +
              '<div class="hl">' + esc(h.answer) + '</div>' +
              '<div class="ht">' +
                '<div class="hq">' + esc(h.question) + '</div>' +
                '<div class="hs">' + esc(h.reason) + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="hr">' + esc(h.fullResponse || h.reason) + '</div>';

          el.addEventListener('click', function () { el.classList.toggle('open'); });
          box.appendChild(el);
        });
      }

      $('snapBtn').addEventListener('click', function () {
        if (cameraReady && drawVideoToCanvas()) {
          processSnap();
          return;
        }
        $('fallbackInput').value = '';
        $('fallbackInput').click();
      });

      $('answerPill').addEventListener('click', openHistory);
      $('histBtn').addEventListener('click', openHistory);

      function openHistory() {
        $('historySheet').classList.add('open');
        $('historySheet').setAttribute('aria-hidden', 'false');
        document.body.classList.add('sheet-open');
      }

      function closeHistory() {
        $('historySheet').classList.remove('open');
        $('historySheet').setAttribute('aria-hidden', 'true');
        document.body.classList.remove('sheet-open');
      }

      document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeHistory); });
      $('scrim').addEventListener('click', closeHistory);

      $('clearHist').addEventListener('click', function () {
        if ($('clearHist').dataset.confirm !== '1') {
          $('clearHist').dataset.confirm = '1';
          $('clearHist').textContent = 'Tap again to clear ' + history.length + ' questions';
          return;
        }
        history = [];
        saveHistory();
        renderHistory();
        $('clearHist').dataset.confirm = '';
        $('clearHist').textContent = 'Clear all questions';
      });

      $('fallbackInput').addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var im = new Image();
          im.onload = function () {
            var s = Math.min(1, 1400 / Math.max(im.width, im.height));
            canvas.width = Math.round(im.width * s);
            canvas.height = Math.round(im.height * s);
            canvas.getContext('2d').drawImage(im, 0, 0, canvas.width, canvas.height);
            processSnap();
          };
          im.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      renderHistory();
      startCamera();
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    })();
  </script>
</body>
</html>
