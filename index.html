<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PMP Snap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>PMP Snap</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      --round: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
      --accent: #0a84ff;
      --ok: #30d158;
      --bad: #ff6b60;
      --st: env(safe-area-inset-top, 0px);
      --sb: env(safe-area-inset-bottom, 0px);
      --sl: env(safe-area-inset-left, 0px);
      --sr: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: var(--font); color: #fff; }
    .hidden { display: none !important; }

    /* Full-screen live camera feed */
    #cameraFeed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      background: #000;
    }

    /* Top floating controls (History top-left, Settings top-right) */
    .top-btn {
      position: fixed;
      top: calc(var(--st) + 16px);
      z-index: 10;
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(28, 28, 30, 0.48);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .top-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    #histBtn { left: calc(var(--sl) + 16px); }
    #gear { right: calc(var(--sr) + 16px); width: 40px; padding: 0; }

    /* Bottom-center Apple-style frosted glass answer pill */
    .glass-answer {
      position: fixed;
      bottom: calc(var(--sb) + 26px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      /* Clearance for bottom-right shutter in both portrait & landscape */
      max-width: calc(100vw - var(--sl) - var(--sr) - 195px);
      min-width: 160px;

      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 18px;
      border-radius: 999px;

      /* Apple iOS Translucent Glass */
      background: rgba(28, 28, 30, 0.54);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);

      cursor: pointer;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.2, 0.85, 0.25, 1);
    }

    .glass-answer.hidden-pill {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
    }

    .qnum-tag {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.72);
      flex-shrink: 0;
    }

    .mode-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 3px 6px;
      border-radius: 6px;
      background: rgba(48, 209, 88, 0.22);
      color: #63e685;
      border: 1px solid rgba(48, 209, 88, 0.35);
      flex-shrink: 0;
    }

    .mode-tag.img-mode {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.72);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .ans-badge {
      font-family: var(--round);
      font-weight: 800;
      font-size: 15px;
      line-height: 1;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(10, 132, 255, 0.88);
      color: #fff;
      flex-shrink: 0;
    }

    .ans-badge.err-badge { background: rgba(255, 107, 96, 0.88); }

    .ans-line {
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.96);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Loading dots */
    .dots { display: flex; gap: 5px; padding: 4px 2px; }
    .dots span {
      width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: 0.35;
      animation: pulse 1s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.1); } }

    /* Bottom-right capture button (Portrait & Landscape pinned bottom-right) */
    .shutter-wrap {
      position: fixed;
      right: calc(var(--sr) + 22px);
      bottom: calc(var(--sb) + 20px);
      z-index: 10;
      display: flex;
      align-items: center;
    }

    @media (orientation: landscape) {
      .shutter-wrap {
        right: calc(var(--sr) + 24px);
        bottom: calc(var(--sb) + 18px);
      }
      .glass-answer {
        bottom: calc(var(--sb) + 22px);
        max-width: calc(100vw - var(--sl) - var(--sr) - 220px);
      }
    }

    .fab {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 3px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      transition: transform 0.12s ease;
    }

    .fab::after {
      content: "";
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .fab:active { transform: scale(0.92); }
    .fab.busy::after {
      background: var(--accent);
      animation: spinPulse 0.9s ease-in-out infinite;
    }
    @keyframes spinPulse { 0%, 100% { transform: scale(0.85); } 50% { transform: scale(1); } }

    /* Bottom Sheets (History & Settings) */
    .scrim {
      position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, 0.55);
      opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s;
    }
    .sheet {
      position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
      max-height: 85vh; overflow-y: auto; max-width: 600px; margin: 0 auto;
      border-radius: 26px 26px 0 0;
      padding: 12px calc(var(--sr) + 20px) calc(var(--sb) + 20px) calc(var(--sl) + 20px);
      background: rgba(22, 24, 30, 0.92);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-bottom: 0;
      transform: translateY(105%); visibility: hidden;
      transition: transform 0.32s cubic-bezier(0.2, 0.85, 0.25, 1), visibility 0.32s;
    }
    body.sheet-open .scrim { opacity: 1; visibility: visible; }
    .sheet.open { transform: none; visibility: visible; }
    .grab { width: 38px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); margin: 0 auto 14px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet h2 { font-size: 20px; font-weight: 700; }

    /* Sorted History List */
    .hist { display: flex; flex-direction: column; gap: 10px; }
    .hitem {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .hitem .row { display: flex; align-items: center; gap: 12px; }
    .hitem .qbadge {
      font-family: var(--round);
      font-weight: 700;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      flex-shrink: 0;
    }
    .hitem .hl {
      font-family: var(--round);
      font-weight: 800;
      font-size: 17px;
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(10, 132, 255, 0.35);
      color: #fff;
      flex-shrink: 0;
    }
    .hitem .ht { flex: 1; min-width: 0; }
    .hitem .hq { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hitem .hs { font-size: 12px; color: rgba(255, 255, 255, 0.6); margin-top: 2px; }
    .hitem .hr { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 13.5px; line-height: 1.45; color: rgba(255,255,255,0.85); }
    .hitem.open .hr { display: block; }
    .hitem.open .hq { white-space: normal; }

    /* Form fields */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.65); letter-spacing: 0.05em; text-transform: uppercase; }
    .field input {
      border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08); color: #fff; padding: 12px 14px;
      font-size: 15px; outline: none; width: 100%;
    }
    .field input:focus { border-color: var(--accent); }
    .field small { font-size: 12.5px; line-height: 1.4; color: rgba(255,255,255,0.6); }
    .field a { color: #7cc0ff; }
    .seg {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px;
      border-radius: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .seg button {
      appearance: none; border: 0; background: transparent; height: 36px; border-radius: 9px;
      font-size: 14px; font-weight: 600; cursor: pointer; color: rgba(255,255,255,0.65);
    }
    .seg button[aria-pressed="true"] { background: #fff; color: #000; }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14); margin-bottom: 14px;
    }
    .toggle-row span { font-size: 14px; font-weight: 600; }
    .toggle-row small { display: block; font-size: 11.5px; color: rgba(255,255,255,0.6); font-weight: 400; }
    .toggle-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
    .status { min-height: 18px; margin: -2px 0 12px; font-size: 13.5px; font-weight: 600; }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    .btn {
      appearance: none; border: 0; cursor: pointer; height: 46px; padding: 0 20px;
      border-radius: 999px; font-size: 16px; font-weight: 600; background: var(--accent); color: #fff; width: 100%;
    }
    .btn.ghost { background: rgba(255, 255, 255, 0.12); margin-top: 8px; }
    .btn.danger { background: transparent; color: var(--bad); margin-top: 8px; font-size: 14px; height: 40px; }
  </style>
</head>
<body>

  <!-- Full-screen live camera -->
  <video id="cameraFeed" autoplay playsinline muted></video>
  <canvas id="captureCanvas" class="hidden"></canvas>

  <!-- Top-left Previous Questions button -->
  <button id="histBtn" class="top-btn" type="button" aria-label="Previous questions">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
      <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
    </svg>
    <span id="histCount">Questions (0)</span>
  </button>

  <!-- Top-right Settings button -->
  <button id="gear" class="top-btn" type="button" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
    </svg>
  </button>

  <!-- Bottom-center Apple frosted glass one-line answer pill -->
  <div id="answerPill" class="glass-answer hidden-pill" role="button" tabindex="0" aria-live="polite"></div>

  <!-- Bottom-right camera shutter button (stays bottom-right in landscape) -->
  <div class="shutter-wrap">
    <button id="snapBtn" class="fab" type="button" aria-label="Capture and solve"></button>
  </div>

  <input id="fallbackInput" type="file" accept="image/*" capture="environment" class="hidden">
  <div id="scrim" class="scrim"></div>

  <!-- Previous Questions Sheet (Sorted by Question Number) -->
  <aside id="historySheet" class="sheet" aria-label="Previous questions" aria-hidden="true">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2>Previous Questions</h2>
      <span style="font-size:12px;color:rgba(255,255,255,0.6);">Sorted by #</span>
    </div>
    <div id="hist" class="hist"></div>
    <button class="btn ghost" data-close type="button" style="margin-top:14px;">Close</button>
    <button id="clearHist" class="btn danger" type="button">Clear all questions</button>
  </aside>

  <!-- Settings Sheet -->
  <aside id="settings" class="sheet" aria-label="Settings" aria-hidden="true">
    <div class="grab"></div>
    <div class="sheet-head"><h2>Settings</h2></div>
    <div class="field">
      <label for="key">Gemini API key</label>
      <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your key">
      <small>Free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Saved locally on this device.</small>
    </div>
    <div class="field">
      <label for="model">Model</label>
      <input id="model" type="text" list="models" autocomplete="off" autocapitalize="off" spellcheck="false">
      <datalist id="models"></datalist>
    </div>
    <div class="field">
      <label id="speedLabel">Speed</label>
      <div class="seg" role="group" aria-labelledby="speedLabel">
        <button type="button" data-level="low" aria-pressed="true">Fast</button>
        <button type="button" data-level="medium" aria-pressed="false">Balanced</button>
        <button type="button" data-level="high" aria-pressed="false">Best</button>
      </div>
    </div>
    <label class="toggle-row" for="useOcr">
      <div>
        <span>Smart OCR Token Saver</span>
        <small>Extracts text on-device first; falls back to image if glare/diagram</small>
      </div>
      <input id="useOcr" type="checkbox" checked>
    </label>
    <div id="saveStatus" class="status" role="status"></div>
    <button id="save" class="btn" type="button">Save and test</button>
    <button class="btn ghost" data-close type="button">Done</button>
  </aside>

  <!-- Tesseract.js v5 for local browser OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      var STORE = 'pmpsnap.v2', HIST = 'pmpsnap.history';
      var API = localStorage.getItem('pmpsnap.api') || 'https://generativelanguage.googleapis.com/v1beta/';
      var cfg = { key: '', model: 'gemini-flash-latest', level: 'low', useOcr: true };

      try {
        var old = JSON.parse(localStorage.getItem('pmpsnap.v1') || '{}');
        if (old.key) cfg.key = old.key;
      } catch (e) {}
      try {
        Object.assign(cfg, JSON.parse(localStorage.getItem(STORE) || '{}'));
      } catch (e) {}

      function persist() {
        try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) {}
      }

      var history = [];
      try { history = JSON.parse(localStorage.getItem(HIST) || '[]'); } catch (e) {}

      function extractQuestionNum(item) {
        if (typeof item.qnum === 'number' && !isNaN(item.qnum)) return item.qnum;
        var m = String(item.question || '').match(/(?:^|\b(?:question|q|#)\s*\.?\s*)(\d{1,4})\b/i);
        return m ? parseInt(m[1], 10) : Number.MAX_SAFE_INTEGER;
      }

      function sortHistoryByNumber() {
        history.sort(function (a, b) {
          var na = extractQuestionNum(a);
          var nb = extractQuestionNum(b);
          if (na !== nb) return na - nb;
          return (a.t || 0) - (b.t || 0);
        });
      }

      function saveHistory() {
        sortHistoryByNumber();
        try {
          localStorage.setItem(HIST, JSON.stringify(history.slice(0, 150)));
        } catch (e) {
          history = history.slice(0, 60);
          try { localStorage.setItem(HIST, JSON.stringify(history)); } catch (e2) {}
        }
      }

      /* ---------- Local Browser OCR (Tesseract.js) ---------- */
      var ocrWorker = null;
      var ocrInitPromise = null;

      function getOcrWorker() {
        if (!window.Tesseract) return Promise.resolve(null);
        if (ocrWorker) return Promise.resolve(ocrWorker);
        if (!ocrInitPromise) {
          ocrInitPromise = Tesseract.createWorker('eng')
            .then(function (w) {
              ocrWorker = w;
              return w;
            })
            .catch(function () {
              ocrInitPromise = null;
              return null;
            });
        }
        return ocrInitPromise;
      }

      async function runLocalOCR(canvasEl) {
        if (!cfg.useOcr) return null;
        var worker = await getOcrWorker();
        if (!worker) return null;
        try {
          var ret = await worker.recognize(canvasEl);
          var rawText = (ret && ret.data && ret.data.text) ? ret.data.text.replace(/\n{3,}/g, '\n\n').trim() : '';
          var confidence = (ret && ret.data && typeof ret.data.confidence === 'number') ? ret.data.confidence : 0;
          // Quality gate: require decent OCR confidence, >= 45 chars, and multiple-choice markers (A/B/C/D)
          var hasOptions = /(?:^|\s)[A-D][\.\)\:]\s+/m.test(rawText);
          if (confidence >= 52 && rawText.length >= 45 && hasOptions) {
            return rawText;
          }
          return null;
        } catch (e) {
          return null;
        }
      }

      /* ---------- Live Camera Initialization ---------- */
      var video = $('cameraFeed');
      var canvas = $('captureCanvas');
      var cameraReady = false;

      async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
        try {
          var stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
          video.srcObject = stream;
          video.onloadedmetadata = function () {
            video.play();
            cameraReady = true;
            // Pre-warm OCR worker quietly after camera starts
            if (cfg.useOcr) setTimeout(getOcrWorker, 800);
          };
        } catch (err) {
          showPillError('Camera blocked — tap shutter to pick photo');
        }
      }

      function drawVideoToCanvas() {
        var w = video.videoWidth;
        var h = video.videoHeight;
        if (!w || !h) return false;
        var scale = Math.min(1, 1280 / Math.max(w, h));
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        return true;
      }

      /* ---------- Prompt (Extracts question number + strict 1-line brief answer) ---------- */
      var SYSTEM = [
        'You are a PMP exam coach. Analyze the practice question provided.',
        'Answer by PMI standards (PMBOK Guide 7th edition, Agile Practice Guide).',
        'Extract the visible question number as an integer in "qnum" (or null if none is visible).',
        'Reply with JSON only in this exact shape:',
        '{"found": true, "qnum": 12, "question": "<brief question summary in max 16 words>", "answer": "B", "reason": "<strictly ONE brief line, max 12 words, explaining why>", "others": [{"option": "A", "why": "<max 12 words>"}], "domain": "People | Process | Business Environment"}',
        'If there is no readable question, reply {"found": false}.'
      ].join(' ');

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      /* ---------- Glass Pill & History Rendering ---------- */
      var pill = $('answerPill');
      var snapBtn = $('snapBtn');

      function showPillLoading(stageText) {
        pill.innerHTML = '<div class="dots"><span></span><span></span><span></span></div><span class="ans-line">' + esc(stageText || 'Analyzing…') + '</span>';
        pill.classList.remove('hidden-pill');
      }

      function showPillAnswer(qnum, answer, reason, usedOcr) {
        var cleanReason = String(reason || '').replace(/\s+/g, ' ').trim();
        var qLabel = (typeof qnum === 'number' && !isNaN(qnum)) ? '<span class="qnum-tag">Q' + esc(qnum) + '</span>' : '';
        var modeBadge = usedOcr
          ? '<span class="mode-tag">OCR</span>'
          : '<span class="mode-tag img-mode">IMG</span>';
        pill.innerHTML = qLabel + '<span class="ans-badge">' + esc(answer) + '</span><span class="ans-line">' + esc(cleanReason) + '</span>' + modeBadge;
        pill.classList.remove('hidden-pill');
      }

      function showPillError(msg) {
        pill.innerHTML = '<span class="ans-badge err-badge">!</span><span class="ans-line">' + esc(msg) + '</span>';
        pill.classList.remove('hidden-pill');
      }

      function renderHistory() {
        sortHistoryByNumber();
        var box = $('hist');
        box.innerHTML = '';
        $('histCount').textContent = 'Questions (' + history.length + ')';

        if (!history.length) {
          box.innerHTML = '<div style="color:rgba(255,255,255,0.6);font-size:14px;padding:8px 2px;">Snapped questions will appear here sorted by question number.</div>';
          return;
        }

        history.forEach(function (h) {
          var num = extractQuestionNum(h);
          var numLabel = num !== Number.MAX_SAFE_INTEGER ? 'Q' + num : 'Q—';
          var el = document.createElement('div');
          el.className = 'hitem';
          el.setAttribute('role', 'button');
          el.tabIndex = 0;

          var othersHtml = (h.others && h.others.length)
            ? '<div style="margin-top:8px;">' + h.others.map(function (o) {
                return '<div><b>' + esc(o.option) + ':</b> ' + esc(o.why) + '</div>';
              }).join('') + '</div>'
            : '';

          el.innerHTML =
            '<div class="row">' +
              '<div class="qbadge">' + esc(numLabel) + '</div>' +
              '<div class="hl">' + esc(h.answer) + '</div>' +
              '<div class="ht">' +
                '<div class="hq">' + esc(h.question || 'Practice question') + '</div>' +
                '<div class="hs">' + esc(h.reason || '') + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="hr">' +
              '<div><b>Why ' + esc(h.answer) + ':</b> ' + esc(h.reason || '') + '</div>' +
              othersHtml +
            '</div>';

          el.addEventListener('click', function () { el.classList.toggle('open'); });
          box.appendChild(el);
        });
      }

      /* ---------- Gemini API Call (Text-only OCR or Image Fallback) ---------- */
      async function callGemini(payload, signal, level) {
        var gen = { responseMimeType: 'application/json' };
        if (level) gen.thinkingConfig = { thinkingLevel: level };

        var userParts = payload.ocrText
          ? [{ text: 'Solve this PMP question in one brief line and extract its question number:\n\n' + payload.ocrText }]
          : [
              { text: 'Solve this question in one brief line and extract its question number.' },
              { inlineData: { mimeType: 'image/jpeg', data: payload.base64Data } }
            ];

        var r = await fetch(API + 'models/' + encodeURIComponent(cfg.model) + ':generateContent', {
          method: 'POST',
          signal: signal,
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cfg.key },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM }] },
            contents: [{ role: 'user', parts: userParts }],
            generationConfig: gen
          })
        });
        var j = {};
        try { j = await r.json(); } catch (e) {}
        if (!r.ok) {
          var err = new Error((j.error && j.error.message) || ('HTTP ' + r.status));
          err.status = r.status;
          throw err;
        }
        var cand = (j.candidates || [])[0] || {};
        return ((cand.content && cand.content.parts) || [])
          .filter(function (p) { return p.text && !p.thought; })
          .map(function (p) { return p.text; })
          .join('')
          .trim();
      }

      function parseResult(text) {
        var t = String(text || '').replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
        try {
          var o = JSON.parse(t);
          if (o && typeof o === 'object') return o;
        } catch (e) {}
        var m = t.match(/\{[\s\S]*\}/);
        if (m) {
          try { return JSON.parse(m[0]); } catch (e) {}
        }
        return { found: true, qnum: null, answer: '?', reason: t.slice(0, 120) };
      }

      var ctl = null;
      async function solveCanvas() {
        if (!cfg.key) {
          openSheet('settings', 'Add your Gemini API key to start.', 'bad');
          return;
        }
        if (ctl) ctl.abort();
        var mine = ctl = new AbortController();
        var timer = setTimeout(function () { mine.abort(); }, 28000);

        snapBtn.classList.add('busy');

        try {
          var ocrText = null;
          if (cfg.useOcr) {
            showPillLoading('Reading text…');
            ocrText = await runLocalOCR(canvas);
            if (mine !== ctl) return;
          }

          var payload = ocrText
            ? { ocrText: ocrText }
            : { base64Data: canvas.toDataURL('image/jpeg', 0.82).split(',')[1] };

          showPillLoading(ocrText ? 'Solving text…' : 'Solving image…');

          var raw;
          try {
            raw = await callGemini(payload, mine.signal, cfg.level);
          } catch (e) {
            if (e.status === 400 && /thinking/i.test(e.message || '')) {
              raw = await callGemini(payload, mine.signal, null);
            } else {
              throw e;
            }
          }
          if (mine !== ctl) return;
          var res = parseResult(raw);
          if (res.found === false) {
            showPillError('No readable question found');
            return;
          }

          var parsedNum = (res.qnum != null && !isNaN(parseInt(res.qnum, 10))) ? parseInt(res.qnum, 10) : null;
          var ansLetter = String(res.answer || '?').toUpperCase();

          showPillAnswer(parsedNum, ansLetter, res.reason, Boolean(ocrText));

          var entry = {
            t: Date.now(),
            qnum: parsedNum,
            question: res.question || 'Practice question',
            answer: ansLetter,
            reason: res.reason || '',
            others: Array.isArray(res.others) ? res.others : [],
            domain: res.domain || ''
          };

          if (parsedNum !== null) {
            var existingIdx = history.findIndex(function (h) { return extractQuestionNum(h) === parsedNum; });
            if (existingIdx >= 0) history[existingIdx] = entry;
            else history.push(entry);
          } else {
            history.push(entry);
          }

          saveHistory();
          renderHistory();

          if (navigator.vibrate) try { navigator.vibrate(25); } catch (e) {}
        } catch (e) {
          if (mine !== ctl) return;
          if (e.name === 'AbortError') showPillError('Request timed out — try again');
          else if (e.status === 429) showPillError('Rate limit reached — wait a moment');
          else if (e.status === 401 || e.status === 403 || e.status === 400) showPillError('Invalid API key — check Settings');
          else showPillError('Connection error — try again');
        } finally {
          clearTimeout(timer);
          if (mine === ctl) snapBtn.classList.remove('busy');
        }
      }

      /* ---------- Shutter Click, Pill Click & Fallback ---------- */
      $('snapBtn').addEventListener('click', function () {
        if (cameraReady && drawVideoToCanvas()) {
          solveCanvas();
          return;
        }
        $('fallbackInput').value = '';
        $('fallbackInput').click();
      });

      $('answerPill').addEventListener('click', function () {
        openSheet('historySheet');
      });

      $('histBtn').addEventListener('click', function () {
        openSheet('historySheet');
      });

      $('fallbackInput').addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var im = new Image();
          im.onload = function () {
            var s = Math.min(1, 1280 / Math.max(im.width, im.height));
            canvas.width = Math.round(im.width * s);
            canvas.height = Math.round(im.height * s);
            canvas.getContext('2d').drawImage(im, 0, 0, canvas.width, canvas.height);
            solveCanvas();
          };
          im.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      /* ---------- Sheets Management ---------- */
      function openSheet(id, note, kind) {
        closeSheets();
        if (id === 'settings') {
          $('key').value = cfg.key;
          $('model').value = cfg.model;
          $('useOcr').checked = cfg.useOcr !== false;
          setLevel(cfg.level);
          $('saveStatus').textContent = note || '';
          $('saveStatus').className = 'status' + (kind ? ' ' + kind : '');
        }
        $(id).classList.add('open');
        $(id).setAttribute('aria-hidden', 'false');
        document.body.classList.add('sheet-open');
      }

      function closeSheets() {
        ['settings', 'historySheet'].forEach(function (id) {
          $(id).classList.remove('open');
          $(id).setAttribute('aria-hidden', 'true');
        });
        document.body.classList.remove('sheet-open');
      }

      function setLevel(level) {
        document.querySelectorAll('.seg button').forEach(function (b) {
          b.setAttribute('aria-pressed', b.dataset.level === level ? 'true' : 'false');
        });
      }

      document.querySelectorAll('.seg button').forEach(function (b) {
        b.addEventListener('click', function () { setLevel(b.dataset.level); });
      });
      document.querySelectorAll('[data-close]').forEach(function (b) {
        b.addEventListener('click', closeSheets);
      });
      $('scrim').addEventListener('click', closeSheets);
      $('gear').addEventListener('click', function () { openSheet('settings'); });

      $('clearHist').addEventListener('click', function () {
        if ($('clearHist').dataset.confirm !== '1') {
          $('clearHist').dataset.confirm = '1';
          $('clearHist').textContent = 'Tap again to clear ' + history.length + ' questions';
          return;
        }
        history = [];
        saveHistory();
        renderHistory();
        $('clearHist').dataset.confirm = '';
        $('clearHist').textContent = 'Clear all questions';
      });

      $('save').addEventListener('click', async function () {
        var level = 'low';
        document.querySelectorAll('.seg button').forEach(function (b) {
          if (b.getAttribute('aria-pressed') === 'true') level = b.dataset.level;
        });
        cfg.key = $('key').value.trim();
        cfg.model = $('model').value.trim() || 'gemini-flash-latest';
        cfg.level = level;
        cfg.useOcr = $('useOcr').checked;
        persist();

        var st = $('saveStatus');
        if (!cfg.key) {
          st.textContent = 'Add an API key to get answers.';
          st.className = 'status bad';
          return;
        }
        st.textContent = 'Checking key…';
        st.className = 'status';
        try {
          var r = await fetch(API + 'models?pageSize=200', { headers: { 'x-goog-api-key': cfg.key } });
          var j = await r.json();
          if (!r.ok) throw new Error((j.error && j.error.message) || 'Invalid key');
          var names = (j.models || [])
            .filter(function (m) { return (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0; })
            .map(function (m) { return m.name.replace(/^models\//, ''); })
            .filter(function (n) { return /^gemini/.test(n) && !/(image|tts|live|audio|embedding)/.test(n); });
          var dl = $('models');
          dl.textContent = '';
          names.forEach(function (n) {
            var o = document.createElement('option');
            o.value = n;
            dl.appendChild(o);
          });
          st.textContent = 'Key works.';
          st.className = 'status ok';
        } catch (e) {
          st.textContent = e.message || 'Key check failed.';
          st.className = 'status bad';
        }
      });

      /* ---------- Boot ---------- */
      renderHistory();
      startCamera();
      if (!cfg.key) {
        setTimeout(function () { openSheet('settings', 'Add your Gemini API key to start.', 'bad'); }, 400);
      }
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    })();
  </script>
</body>
